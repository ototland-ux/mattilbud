name: Ukentlig Mattilbud Skraper

on:
  schedule:
    - cron: '0 5 * * 1'  # Kjører hver mandag klokken 05:00 UTC
  workflow_dispatch:      # Lar deg kjøre den manuelt fra GitHub når du vil

jobs:
  skrap-og-oppdater:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer nødvendige biblioteker
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kjør skraperen
        run: python skraper.py

      - name: Send oppdatert tilbud.json til GitHub
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          force: true
