name: Ukentlig Mattilbud Skraper

on:
  schedule:
    - cron: '0 5 * * 1'  # Kjører hver mandag klokken 05:00 UTC
  workflow_dispatch:      # Lar deg kjøre den manuelt fra GitHub når du vil

permissions:
  contents: write

jobs:
  skrap-og-oppdater:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer nødvendige biblioteker
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Kjør skraperen
        run: python skraper.py

      - name: Commit og push endringer
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatisk oppdatering av tilbud.json"
          file_pattern: "tilbud.json"
